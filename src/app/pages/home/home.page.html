<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mis Tareas</ion-title>

    <ion-buttons slot="end">
      <ion-button *ngIf="showDelete$ | async" (click)="deleteAll()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="goToSettings()">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Filter Section -->
  <div class="filter-section">
    <ion-item lines="none">
      <ion-label>Filtrar por categoría:</ion-label>
      <ion-select
        interface="action-sheet"
        placeholder="Todas las categorías"
        (ionChange)="onCategoryFilterChange($event)"
      >
        <ion-select-option value="all">
          <ion-icon name="layers-outline"></ion-icon>
          Todas las categorías
        </ion-select-option>
        <ion-select-option *ngFor="let cat of (categories$ | async)" [value]="cat.id">
          {{ cat.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <div>
    <ng-container *ngIf="(tasks$ | async) as tasks">
      <ng-container *ngIf="tasks.length === 0">
        <div class="empty-state">
          <ion-icon name="checkbox-outline"></ion-icon>
          <h2>Sin tareas</h2>
          <p>Crea tu primera tarea para comenzar</p>
        </div>
      </ng-container>
      <ion-list lines="none" *ngIf="tasks.length > 0">
        <ion-item-sliding *ngFor="let task of tasks">
          <ion-item class="task-item" [ngClass]="{ completed: task.completed }">
            <ion-label>
              <h2>{{ task.title }}</h2>
              <ion-badge [color]="task.categoryId | categoryColor" mode="ios">
                {{ task.categoryId | categoryName }}
              </ion-badge>
            </ion-label>

            <ion-checkbox
              slot="end"
              [checked]="task.completed"
              (ionChange)="toggleTask(task.id)"
            >
            </ion-checkbox>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="deleteTask(task.id)">
              <ion-icon slot="icon-only" name="trash" style="color: white;"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </ng-container>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="presentAlert()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
